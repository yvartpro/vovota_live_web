<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vovota - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 900px;
            margin: 4rem auto;
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="url"],
        textarea,
        select {
            width: 100%;
            padding: 1rem;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-header {
            margin-bottom: 2.5rem;
            text-align: left;
        }

        .form-header h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .status-banner {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: none;
        }

        .status-success {
            background: rgba(0, 255, 127, 0.1);
            color: #00ff7f;
            border: 1px solid #00ff7f;
        }

        .status-error {
            background: rgba(255, 69, 58, 0.1);
            color: #ff453a;
            border: 1px solid #ff453a;
        }
    </style>
</head>

<body>
    <div class="background-glow"></div>

    <main class="admin-container">
        <header class="form-header">
            <a href="index.html"
                style="color: var(--primary); text-decoration: none; font-size: 0.9rem; display: block; margin-bottom: 1rem;">←
                Back to Site</a>
            <h2>Publish News</h2>
            <p class="tagline">Fill in the details to publish a new post to Vovota Live.</p>
        </header>

        <div id="status-banner" class="status-banner"></div>

        <section class="download-card">
            <form action="https://bsm.vmgburundi.com/api/myadmin/vt/staff" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="title">News Title</label>
                    <input type="text" id="title" name="title" placeholder="Enter post title" required>
                </div>

                <div class="form-group">
                    <label for="excerpt">Excerpt / Short Summary</label>
                    <textarea id="excerpt" name="excerpt" placeholder="A brief preview of the news"></textarea>
                </div>

                <div class="form-group">
                    <label for="content">Full Content</label>
                    <textarea id="content" name="description" placeholder="The main body of your news post"
                        required></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="thumbnail">Thumbnail URL</label>
                        <input type="url" id="thumbnail" name="thumbnail" placeholder="https://example.com/thumb.jpg">
                    </div>
                    <div class="form-group">
                        <label for="source">Source (Optional)</label>
                        <input type="text" id="source" name="source" placeholder="Burundi Sport">
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">Publish Post
                        Now</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Vovota Admin Dashboard.</p>
    </footer>

    <script src="admin.js"></script>
</body>

</html>
